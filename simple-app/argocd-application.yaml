apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-simple-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bus57790/argocd.git
    targetRevision: main
    path: simple-app/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
