apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Define the webhook service properly
  service.webhook.slack: |
    url: $slack-token
    headers:
      - name: Content-Type
        value: application/json

  # Define notification templates
  template.app-deployed: |
    webhook:
      slack:
        method: POST
        body: |
          {
            "text": "🚀 *Application Sync Succeeded*\n*App:* {{.app.metadata.name}}\n*Status:* {{.app.status.sync.status}}\n*Revision:* {{.app.status.sync.revision}}"
          }

  template.app-sync-failed: |
    webhook:
      slack:
        method: POST
        body: |
          {
            "text": "⚠️ *Application Sync Failed*\n*App:* {{.app.metadata.name}}\n*Health:* {{.app.status.health.status}}"
          }

  # Define triggers pointing to the templates
  trigger.on-deployed: |
    - when: app.status.sync.status == 'Synced' and app.status.health.status == 'Healthy'
      send: [app-deployed]

  trigger.on-sync-failed: |
    - when: app.status.sync.status == 'OutOfSync' or app.status.health.status == 'Degraded'
      send: [app-sync-failed]
