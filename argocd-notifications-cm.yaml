apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Native Slack service definition
  service.slack: |
    token: $slack-token

  # Templates using native message field instead of raw webhook body
  template.app-deployed: |
    message: |
      🚀 *Application Sync Succeeded*
      *App:* {{.app.metadata.name}}
      *Status:* {{.app.status.sync.status}}
      *Revision:* {{.app.status.sync.revision}}

  template.app-sync-failed: |
    message: |
      ⚠️ *Application Sync Failed*
      *App:* {{.app.metadata.name}}
      *Health:* {{.app.status.health.status}}

  # Triggers
  trigger.on-deployed: |
    - when: app.status.sync.status == 'Synced' and app.status.health.status == 'Healthy'
      send: [app-deployed]

  trigger.on-sync-failed: |
    - when: app.status.sync.status == 'OutOfSync' or app.status.health.status == 'Degraded'
      send: [app-sync-failed]
